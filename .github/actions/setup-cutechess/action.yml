name: Set up cutechess-cli
description: >
  Builds cutechess-cli from source and puts it on the PATH. Version 1.3
  is the last that builds against Qt 5.15, which Ubuntu 24.04 ships;
  later versions need Qt 6.8.

inputs:
  version:
    description: cutechess release tag.
    default: v1.3.1

runs:
  using: composite
  steps:
    # The Qt libraries are needed at run time as well, so they are
    # installed whether or not the build is cached.
    - name: Install Qt
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends cmake g++ qtbase5-dev libqt5svg5-dev

    - name: Cache the build
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/cutechess-bin
        key: cutechess-${{ inputs.version }}-${{ runner.os }}-${{ runner.arch }}

    - name: Build
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        git clone --quiet --depth 1 --branch "$VERSION" https://github.com/cutechess/cutechess.git ~/cutechess-src
        cmake -S ~/cutechess-src -B ~/cutechess-src/build -DCMAKE_BUILD_TYPE=Release -DWITH_TESTS=OFF
        cmake --build ~/cutechess-src/build --target cli --parallel "$(nproc)"
        mkdir -p ~/cutechess-bin
        cp ~/cutechess-src/build/cutechess-cli ~/cutechess-bin/

    - name: Add to PATH
      shell: bash
      run: |
        echo "$HOME/cutechess-bin" >> "$GITHUB_PATH"
        "$HOME/cutechess-bin/cutechess-cli" --version
