name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-dyalog
      # run-tests.apls exits with code 1 when a file fails to load or any
      # test fails or errors.
      - name: Run the test suite
        run: dyalogscript run-tests.apls
